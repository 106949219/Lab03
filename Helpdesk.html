<!DOCTYPE html>

<HTML lang="en">
    <HEAD>
        <meta charset="UTF-8">
        <meta name="description" content="Introduction to basic HTML elements">
        <meta name="keywords" content="HTML, Doctype, Head, Body, Meta, Paragraph, Headings, form,">
        <meta name="author" content="Mohamed Rayan Fersadou">

        <title>CWA help desk appointment</title>
    </HEAD>
    <BODY>
        <a href="http://www.swinburne.edu.au">
        <img src="logo.png" alt="CWA Logo" width="200" height="100">
        </a>
        <h1>CWA Help Desk Appointment</h1>
        <p>The Help Desk is located in ACT620.Open 10:30 to 19:00 Monday to Friday.</p>
        <p>Check blackboard for when CWA tutors will be there.</p>
        <form method="post" action="http://mercury.swin.edu.au/it000000/formtest.php">
            ;<fieldset>
                <legend>Student details</legend>
                <label for="Student_ID">Student ID</label>
                <input type="text" id="Student_ID" name="Student_ID" required pattern="[0-9]{7,10}">
                <br>
                <label for="Given_name">Given name</label>
                <input type="text" id="Given_name" name="Given_name" required>
                <label for="Family_name">Family name</label>
                <input type="text" id="Family_name" name="Family_name" required>
            </fieldset>
            <fieldset>
                <legend>Your unit</legend>
                <input type="radio" id="COS10011" name="COS10011" value="COS10011">
                <label for="COS10011">COS10011</label>
                <input type="radio" id="COS60004" name="COS60004" value="COS60004">
                <label for="COS60004">COS60004</label>
                <input type="radio" id="COS60007" name="COS60007" value="COS60007">
                <label for="COS60007">COS60007</label>
                <br>
                <label for="Your_tutor">Your tutor:</label>
                <select id="Your_tutor" name="Your_tutor" required>
                    <option value="">Please select</option>
                    <option value="Hamada">Hamada</option>
                    <option value="Afnan">Afnan</option>
                    <option value="Khalid">Khalid</option>
                </select>
            </fieldset>
            <fieldset>
                <legend>Issue</legend>
                <input type="checkbox" id="HTML" name="Language" value="HTML" checked>
                <label for="HTML">HTML</label>
                <input type="checkbox" id="CSS" name="Language" value="CSS">
                <label for="CSS">CSS</label>
                <input type="checkbox" id="JavaScript" name="Language" value="JavaScript">
                <label for="JavaScript">JavaScript</label>
                <input type="checkbox" id="PHP" name="Language" value="PHP">
                <label for="PHP">PHP</label>
                <input type="checkbox" id="MySQL" name="Language" value="MySQL">
                <label for="MySQL">MySQL</label>
                <br>
                <label for="Description_of_issue">Description of issue</label>
                <br>
                <textarea id="Description_of_issue" name="Description_of_issue" placeholder="Write description of your problem here..." 
                required></textarea>
            </fieldset>
            <fieldset>
                <legend>Preferred Date/Time</legend>
                <label for="date">Date</label>
                <input type="text" id="date" name="date" placeholder="dd/mm/yyyy" 
                pattern="(0[1-9]|[12][0-9]|3[01])/(0[1-9]|1[012])/[0-9]{4}" required>
                <br>
                <label for="time">Time</label>
                <input type="text" id="time" name="time" placeholder="00:00" 
                pattern="([01]?[0-9]|2[0-3]):[0-5][0-9]">
            </fieldset>
            <input type= "submit" value="book">
	        <input type= "reset" value="Reset Form">
        </form>
    </BODY>
</HTML>
